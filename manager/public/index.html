<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binder Town Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* same tokens as Pelican Manager (manager/public/style.css) */
  :root {
    --bg-main: #060a14;
    --bg-card: rgba(14, 21, 40, 0.78);
    --bg-card-hover: rgba(22, 32, 58, 0.88);
    --bg-inset: rgba(4, 8, 20, 0.55);
    --line: rgba(148, 163, 184, 0.12);
    --line-strong: rgba(148, 163, 184, 0.22);
    --border-glow: rgba(56, 189, 248, 0.45);
    --text-main: #eef3fc;
    --text-muted: #8d9ab5;
    --text-faint: #5d6983;
    --primary: #0ea5e9;
    --primary-hover: #0284c7;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --font-sans: 'Plus Jakarta Sans', 'IBM Plex Sans Thai', system-ui, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Sans Thai', ui-monospace, Consolas, monospace;
    --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg-main);
    background-image:
      radial-gradient(1200px 600px at 0% -10%, rgba(14, 165, 233, 0.14), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(139, 92, 246, 0.13), transparent 60%);
    background-attachment: fixed;
    color: var(--text-main); font: 14px/1.5 var(--font-sans); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.18); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  .mono { font-family: var(--font-mono); }
  .muted { color: var(--text-muted); }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .app { max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }

  /* header */
  .app-header {
    position: sticky; top: 12px; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    background: rgba(10, 16, 32, 0.95); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: 14px 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand-logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, #0ea5e9, #8b5cf6); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35); }
  .brand-logo svg { width: 24px; height: 24px; color: #fff; }
  .brand h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .brand .sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-muted); }
  .ver-pill { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: rgba(14, 165, 233, 0.12); border: 1px solid rgba(14, 165, 233, 0.3); color: #7dd3fc; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line-strong); background: var(--bg-inset); color: var(--text-muted); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.ok { color: var(--green); border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.08); }
  .chip.warn { color: var(--amber); border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.08); }
  .chip.bad { color: var(--red); border-color: rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.08); }
  .chip.info { color: #7dd3fc; border-color: rgba(14, 165, 233, 0.35); background: rgba(14, 165, 233, 0.08); }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--radius-sm);
    font: 600 13px/1 var(--font-sans); cursor: pointer; border: 1px solid var(--line-strong); background: rgba(148, 163, 184, 0.08); color: var(--text-main);
    transition: background .15s, border-color .15s, transform .1s; }
  .btn:hover:not(:disabled) { background: rgba(148, 163, 184, 0.16); border-color: rgba(148, 163, 184, 0.35); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, .tab-btn:focus-visible, summary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn svg.i { width: 16px; height: 16px; }
  .btn.primary { background: linear-gradient(135deg, #0ea5e9, #0284c7); border-color: rgba(56, 189, 248, 0.6); color: #fff; box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3); }
  .btn.primary:hover:not(:disabled) { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
  .btn.go { background: linear-gradient(135deg, #10b981, #059669); border-color: rgba(52, 211, 153, 0.6); color: #fff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25); }
  .btn.go:hover:not(:disabled) { background: linear-gradient(135deg, #34d399, #10b981); }
  .btn.stop { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.45); color: #fecaca; }
  .btn.stop:hover:not(:disabled) { background: rgba(248, 113, 113, 0.22); }

  /* stat cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .stat { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: var(--radius-lg); background: var(--bg-card); border: 1px solid var(--line); }
  .stat-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .stat-icon svg { width: 22px; height: 22px; }
  .stat-icon.blue { background: rgba(14, 165, 233, 0.12); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.25); }
  .stat-icon.green { background: rgba(52, 211, 153, 0.12); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.25); }
  .stat-icon.red { background: rgba(248, 113, 113, 0.12); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.25); }
  .stat-icon.purple { background: rgba(167, 139, 250, 0.12); color: var(--purple); border: 1px solid rgba(167, 139, 250, 0.25); }
  .stat-body { flex: 1; min-width: 0; }
  .stat-label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
  .stat-value { font: 700 26px/1.2 var(--font-mono); }
  .stat-value small { font-size: 14px; color: var(--text-faint); font-weight: 600; }
  .bar { height: 6px; border-radius: 99px; background: rgba(148, 163, 184, 0.12); overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #0ea5e9, #22e3c4); transition: width .4s; }
  .bar.green > i { background: linear-gradient(90deg, #10b981, #34d399); }
  .bar.amber > i { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .bar.red > i { background: linear-gradient(90deg, #ef4444, #f87171); }
  .bar.purple > i { background: linear-gradient(90deg, #8b5cf6, #c4b5fd); }

  /* tabs */
  .tab-bar { display: flex; gap: 6px; padding: 5px; border-radius: 14px; background: var(--bg-inset); border: 1px solid var(--line); width: fit-content; max-width: 100%; overflow-x: auto; }
  .tab-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--text-muted); font: 600 13.5px var(--font-sans); cursor: pointer; white-space: nowrap; }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn.active { color: var(--text-main); background: rgba(14, 165, 233, 0.14); border-color: rgba(14, 165, 233, 0.4); }
  .tab-count { font: 700 11.5px var(--font-mono); padding: 1px 8px; border-radius: 99px; background: rgba(148, 163, 184, 0.14); }
  .tab-btn.active .tab-count { background: rgba(14, 165, 233, 0.3); color: #e0f2fe; }
  .pane { display: none; } .pane.active { display: block; }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, background .15s; }
  .card:hover { border-color: var(--line-strong); background: var(--bg-card-hover); }
  .card.running { border-color: rgba(52, 211, 153, 0.3); }
  .card.dead { border-color: rgba(248, 113, 113, 0.45); }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff; flex: none; }
  .card-title { flex: 1; min-width: 0; }
  .card-title b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-title span { display: block; font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phase { padding: 10px 12px; border-radius: var(--radius-md); background: var(--bg-inset); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .phase svg { color: var(--primary); }
  .card.dead .phase { color: #fecaca; border-color: rgba(248, 113, 113, 0.3); } .card.dead .phase svg { color: var(--red); }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .meter-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .meter-label b { color: var(--text-main); font-family: var(--font-mono); font-weight: 600; }
  .meter-label b.low { color: var(--red); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .facts dt { color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .facts dt svg { width: 14px; height: 14px; }
  .facts dd { min-width: 0; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; }
  .actions .btn { flex: 1; }
  details.log { border-top: 1px solid var(--line); padding-top: 8px; }
  details.log summary { cursor: pointer; font-size: 12.5px; color: var(--text-muted); font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.log summary::-webkit-details-marker { display: none; }
  details.log summary svg { width: 14px; height: 14px; transition: transform .15s; }
  details.log[open] summary svg { transform: rotate(90deg); }
  details.log ol { list-style: none; margin-top: 6px; max-height: 150px; overflow: auto; font: 12px/1.6 var(--font-mono); color: var(--text-muted); }

  /* browsers */
  .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .note { margin-top: 12px; font-size: 13px; color: var(--text-muted); }
  .empty { padding: 36px 20px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--text-muted); display: grid; gap: 12px; justify-items: center; }
  .empty svg { width: 34px; height: 34px; color: var(--text-faint); }
  .empty b { color: var(--text-main); font-size: 15px; }

  /* toast */
  #toast { position: fixed; right: 16px; bottom: 16px; z-index: 100; max-width: min(440px, calc(100vw - 32px)); padding: 12px 16px; border-radius: var(--radius-md);
    background: rgba(10, 16, 32, 0.97); border: 1px solid var(--border-glow); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); white-space: pre-wrap; font-size: 13.5px;
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: none; pointer-events: auto; }
  #toast.bad { border-color: rgba(248, 113, 113, 0.6); }
  @media (max-width: 640px) {
    .app-header { position: static; }
    .grid { grid-template-columns: 1fr; }
    .meters { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pad" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo"><svg class="i"><use href="#i-pad"/></svg></div>
      <div>
        <h1>Binder Town Manager</h1>
        <div class="sub">ตัวช่วยฟาร์มหลายแท็บ <span id="ver" class="ver-pill">…</span></div>
      </div>
    </div>
    <div class="header-actions">
      <span id="role" class="chip"></span>
      <span id="upd" class="chip"></span>
      <button id="chk" class="btn"><svg class="i"><use href="#i-reload"/></svg>เช็กอัปเดต</button>
      <button id="pull" class="btn primary" hidden><svg class="i"><use href="#i-down"/></svg><span>อัปเดต</span></button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><div class="stat-icon blue"><svg class="i"><use href="#i-pad"/></svg></div>
      <div class="stat-body"><div class="stat-label">helper พร้อม</div><div class="stat-value" id="s-ready">0</div><div class="bar"><i id="b-ready" style="width:0"></i></div></div></div>
    <div class="stat"><div class="stat-icon green"><svg class="i"><use href="#i-activity"/></svg></div>
      <div class="stat-body"><div class="stat-label">กำลังฟาร์ม</div><div class="stat-value" id="s-run">0</div><div class="bar green"><i id="b-run" style="width:0"></i></div></div></div>
    <div class="stat"><div class="stat-icon red"><svg class="i"><use href="#i-alert"/></svg></div>
      <div class="stat-body"><div class="stat-label">ต้องดู (ตาย / หยุด)</div><div class="stat-value" id="s-warn">0</div></div></div>
    <div class="stat"><div class="stat-icon purple"><svg class="i"><use href="#i-globe"/></svg></div>
      <div class="stat-body"><div class="stat-label">เบราว์เซอร์เปิดอยู่</div><div class="stat-value" id="s-br">0</div></div></div>
  </section>

  <nav class="tab-bar" role="tablist">
    <button class="tab-btn active" data-tab="tabs" role="tab" aria-selected="true"><svg class="i"><use href="#i-pad"/></svg>แท็บเกม <span class="tab-count" id="c-tabs">0</span></button>
    <button class="tab-btn" data-tab="browsers" role="tab" aria-selected="false"><svg class="i"><use href="#i-globe"/></svg>เบราว์เซอร์ <span class="tab-count" id="c-br">0</span></button>
  </nav>

  <section class="pane active" data-pane="tabs"><div id="tabs" class="grid"></div></section>
  <section class="pane" data-pane="browsers">
    <div id="browsers" class="bgrid"></div>
    <p class="note">แต่ละเบราว์เซอร์ใช้โปรไฟล์ของตัวเองในโฟลเดอร์ profiles ล็อกอินครั้งแรกครั้งเดียว ถ้าใช้คนละไอดี ให้แยกเบราว์เซอร์</p>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ic = (id, cls = 'i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
let toastT = 0;
function say(text, bad) {
  const t = $('#toast'); if (!text) return t.classList.remove('show');
  t.textContent = text; t.classList.toggle('bad', !!bad); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), bad ? 9000 : 4000);
}
async function post(url) {
  try { const r = await fetch(url, { method: 'POST' }); const j = await r.json(); if (j.msg) say(j.msg, !j.ok); return j; }
  catch (e) { say('ติดต่อตัวจัดการไม่ได้: ' + e.message, true); return {}; }
}
const STATE = { loading: ['ยังไม่เข้าเกม', 'warn'], world: ['กำลังโหลด helper', 'warn'], helper: ['helper พร้อม', 'ok'] };
const COLORS = { edge: '#0ea5e9,#2563eb', chrome: '#f59e0b,#ef4444', brave: '#fb7185,#f97316', vivaldi: '#ef4444,#a855f7' };
const avatar = (key, name) => `<div class="avatar" style="background:linear-gradient(135deg,${COLORS[key] || '#64748b,#334155'})">${esc((name || '?')[0])}</div>`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const openLogs = new Set();

function renderUpdate(u) {
  if (!u) return;
  $('#role').innerHTML = u.main ? '<span class="dot"></span>เครื่องหลัก' : u.autoPull ? '<span class="dot"></span>อัปเดตตามเครื่องหลัก' : '<span class="dot"></span>อัปเดตเอง';
  $('#role').className = 'chip ' + (u.main ? 'info' : '');
  if (!u.isRepo) { $('#ver').textContent = 'ไม่ใช่ git'; $('#upd').className = 'chip bad'; $('#upd').textContent = u.error || 'อัปเดตไม่ได้'; $('#pull').hidden = true; return; }
  $('#ver').textContent = `${u.commit} · ${u.date}`;
  $('#upd').className = 'chip ' + (u.error ? 'bad' : u.behind ? 'warn' : 'ok');
  $('#upd').innerHTML = '<span class="dot"></span>' + esc(u.error ? 'เช็กอัปเดตไม่ได้' : u.behind ? `มีอัปเดต ${u.behind} commit` : u.checkedAt ? 'เวอร์ชันล่าสุด' : 'ยังไม่ได้เช็ก');
  $('#upd').title = u.error || (u.incoming || []).join('\n');
  $('#pull').hidden = !u.behind;
  $('#pull span').textContent = `อัปเดต (${u.behind})`;
  $('#pull').title = (u.incoming || []).join('\n');
}
function renderBrowsers(list) {
  $('#browsers').innerHTML = list.map(b => `<div class="card">
    <div class="card-head">${avatar(b.key, b.name)}<div class="card-title"><b>${esc(b.name)}</b><span class="mono">port ${b.port} · ${b.tabs.length} แท็บเกม</span></div>
      <span class="chip ${b.running ? 'ok' : b.installed ? '' : 'bad'}"><span class="dot"></span>${b.running ? 'เปิดอยู่' : b.installed ? 'ปิด' : 'ไม่มีในเครื่อง'}</span></div>
    <button class="btn ${b.running ? '' : 'primary'}" data-open="${b.key}" ${b.installed ? '' : 'disabled'}>${ic(b.running ? 'plus' : 'play')}${b.running ? 'เปิดแท็บเกมเพิ่ม' : 'เปิดเกม'}</button></div>`).join('');
}
function tabCard(t) {
  const s = t.status, [label, cls] = STATE[t.state] || [t.state, ''];
  const head = `<div class="card-head">${avatar(t.key, t.browser)}<div class="card-title"><b>${esc(s && s.map ? s.map : t.browser)}</b>
    <span>${s ? `${esc(t.browser)} · CH${s.channel || '?'} · Lv ${s.level || '?'}` : 'รอเข้าเกม'}</span></div>
    <span class="chip ${s ? (s.dead ? 'bad' : s.running ? 'ok' : '') : cls}"><span class="dot"></span>${s ? (s.dead ? 'ตาย' : s.running ? 'ทำงาน' : 'หยุด') : label}</span></div>`;
  if (!s) return `<div class="card">${head}<div class="phase">${ic('alert')}${esc(t.title || label)}</div></div>`;
  const w = s.weight || 0, wc = w >= 90 ? 'red' : w >= 70 ? 'amber' : 'green';
  const pots = (s.potions || []).map(p => {
    const low = p.min && p.have !== null && p.have < p.min, max = Math.max(p.to || 0, p.have || 0, 1);
    return `<div><div class="meter-label">${esc(p.name)}<b class="${low ? 'low' : ''}">${p.have ?? '?'}${p.min ? ` / ขั้นต่ำ ${p.min}` : ''}</b></div>
      <div class="bar ${low ? 'red' : ''}"><i style="width:${pct(p.have || 0, max)}%"></i></div></div>`;
  }).join('');
  const b = s.bounty;
  const bounty = b ? `<div style="grid-column:1/-1"><div class="meter-label">ค่าหัว ${esc(b.mob)} (ตัวที่ ${b.done + 1}/${b.total})<b>${b.prog}/${b.need}</b></div>
    <div class="bar purple"><i style="width:${pct(b.prog, b.need)}%"></i></div></div>` : '';
  const spot = s.farmMap ? esc(s.farmMap) + (s.farmSpot ? ` <span class="mono muted">(${s.farmSpot.x.toFixed(0)}, ${s.farmSpot.y.toFixed(0)})</span>` : '') : '<span class="muted">ยังไม่ตั้ง</span>';
  const logs = s.log || [];
  return `<div class="card ${s.dead ? 'dead' : s.running ? 'running' : ''}">${head}
    <div class="phase">${ic(s.dead ? 'alert' : 'activity')}<span>${esc(s.phase)}</span></div>
    <div class="meters">
      <div><div class="meter-label">น้ำหนัก<b class="${w >= 90 ? 'low' : ''}">${w}%</b></div><div class="bar ${wc}"><i style="width:${Math.min(100, w)}%"></i></div></div>
      ${pots}${bounty}
    </div>
    <dl class="facts">
      <dt>${ic('pin')}จุดฟาร์ม</dt><dd>${spot}</dd>
      <dt>${ic('map')}เมืองขาย</dt><dd>${esc(s.town || '—')}</dd>
      <dt>${ic('target')}AUTO</dt><dd>${s.auto ? 'เปิด' : '<span class="muted">ปิด</span>'}</dd>
    </dl>
    <div class="actions">
      <button class="btn ${s.running ? 'stop' : 'go'}" data-toggle="${t.id}">${ic(s.running ? 'stop' : 'play')}${s.running ? 'หยุด' : 'เริ่ม'}</button>
      <button class="btn" data-reload="${t.id}" title="โหลด helper ใหม่ในแท็บนี้">${ic('reload')}โหลด helper ใหม่</button>
    </div>
    ${logs.length ? `<details class="log" data-log="${t.id}" ${openLogs.has(t.id) ? 'open' : ''}><summary>${ic('chev')}บันทึกล่าสุด · ${esc(logs[0])}</summary>
      <ol>${logs.map(l => `<li>${esc(l)}</li>`).join('')}</ol></details>` : ''}
  </div>`;
}
function renderTabs(list) {
  const all = list.flatMap(b => b.tabs.map(t => ({ ...t, browser: b.name, key: b.key })));
  const ready = all.filter(t => t.status).length, run = all.filter(t => t.status && t.status.running).length;
  const warn = all.filter(t => t.status && (t.status.dead || !t.status.running)).length;
  $('#s-ready').innerHTML = `${ready}<small> / ${all.length}</small>`; $('#b-ready').style.width = pct(ready, all.length) + '%';
  $('#s-run').innerHTML = `${run}<small> / ${all.length}</small>`; $('#b-run').style.width = pct(run, all.length) + '%';
  $('#s-warn').textContent = warn; $('#s-warn').style.color = warn ? 'var(--red)' : '';
  $('#s-br').innerHTML = `${list.filter(b => b.running).length}<small> / ${list.filter(b => b.installed).length}</small>`;
  $('#c-tabs').textContent = all.length; $('#c-br').textContent = list.filter(b => b.running).length;
  $('#tabs').innerHTML = all.length ? all.map(tabCard).join('')
    : `<div class="empty" style="grid-column:1/-1">${ic('pad')}<b>ยังไม่มีแท็บเกม</b><span>เปิดเกมจากแท็บ "เบราว์เซอร์" แล้วล็อกอินเข้าเกม helper จะโหลดเองเมื่อเข้าเกมแล้ว</span>
      <button class="btn primary" data-goto="browsers">${ic('globe')}ไปที่เบราว์เซอร์</button></div>`;
}
let lastOk = true;
async function refresh() {
  try {
    const r = await fetch('/api/status'); const j = await r.json();
    renderUpdate(j.update); renderBrowsers(j.browsers); renderTabs(j.browsers);
    if (!lastOk) say(''); lastOk = true;
  } catch { if (lastOk) say('ติดต่อตัวจัดการไม่ได้ หน้าต่างดำ (Start_Binder.bat) ยังเปิดอยู่ไหม?', true); lastOk = false; }
}
function showTab(name) {
  for (const b of document.querySelectorAll('.tab-btn')) { const on = b.dataset.tab === name; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); }
  for (const p of document.querySelectorAll('.pane')) p.classList.toggle('active', p.dataset.pane === name);
}
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.log) d.open ? openLogs.add(d.dataset.log) : openLogs.delete(d.dataset.log); }, true);
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.tab) return showTab(b.dataset.tab);
  if (b.dataset.goto) return showTab(b.dataset.goto);
  if (b.dataset.open) { b.disabled = true; say('กำลังเปิด…'); await post(`/api/browser/${b.dataset.open}/open`); }
  else if (b.dataset.toggle) { b.disabled = true; await post(`/api/tab/${b.dataset.toggle}/toggle`); }
  else if (b.dataset.reload) { b.disabled = true; await post(`/api/tab/${b.dataset.reload}/reload`); }
  else if (b.id === 'chk') { b.disabled = true; const j = await post('/api/update/check'); if (j.update) { renderUpdate(j.update); say(j.update.behind ? `มีอัปเดต ${j.update.behind} commit:\n${j.update.incoming.join('\n')}` : (j.update.error || 'เป็นเวอร์ชันล่าสุดแล้ว'), !!j.update.error); } b.disabled = false; }
  else if (b.id === 'pull') { b.disabled = true; say('กำลังอัปเดต…'); const j = await post('/api/update/pull'); if (j.restart) setTimeout(() => location.reload(), 5000); }
  refresh();
});
refresh(); setInterval(refresh, 2000);
</script>
</body>
